services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # Auto-register all classes in Classes/ directory
  Hn\MailSender\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'
      # Version-specific decorators are registered conditionally via Configuration/Services.php
      - '../Classes/Form/FormEditor/ConfigurationServiceDecoratorV12.php'
      - '../Classes/Form/FormEditor/ConfigurationServiceDecoratorV13.php'

  # Autoconfigure validators with tag
  _instanceof:
    Hn\MailSender\Validation\SenderAddressValidatorInterface:
      tags: ['mail_sender.validator']
    Hn\MailSender\Import\SenderAddressSourceProviderInterface:
      tags: ['mail_sender.source_provider']

  # Validation Service with tagged iterator
  Hn\MailSender\Service\ValidationService:
    public: true
    arguments:
      $validators: !tagged_iterator mail_sender.validator
      $emlParserService: '@Hn\MailSender\Service\EmlParserService'

  # Sender Address Import Service (public for scheduler task access)
  Hn\MailSender\Service\SenderAddressImportService:
    public: true
    arguments:
      $sourceProviders: !tagged_iterator mail_sender.source_provider

  # Form Finisher source provider. The FormPersistenceManager is an optional dependency
  # (@? injects null when EXT:form is not installed) because the provider must also work
  # without EXT:form, and because the interface is no longer publicly resolvable via
  # makeInstance() on TYPO3 v14 - it must be injected. Public so functional tests can fetch it.
  Hn\MailSender\Import\Provider\FormFinisherConfigurationProvider:
    public: true
    arguments:
      $formPersistenceManager: '@?TYPO3\CMS\Form\Mvc\Persistence\FormPersistenceManagerInterface'

  # Backend Module Controller
  Hn\MailSender\Controller\MailSenderController:
    public: true

  # Console Command
  Hn\MailSender\Command\ValidateSenderCommand:
    tags:
      - name: 'console.command'
        command: 'mail:sender:validate'
        description: 'Validate email sender addresses'

  # Webhook Notification Service (public for scheduler task access via makeInstance)
  Hn\MailSender\Service\WebhookNotificationService:
    public: true

  # Status Report Provider
  Hn\MailSender\Report\MailSenderStatusProvider:
    tags:
      - name: 'reports.status'
